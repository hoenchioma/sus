# Builds the Android TV app. Every push to main refreshes the rolling "latest" pre-release, which
# <site>/tv.apk redirects to, so the app follows main the way the site does. Pushing a version tag
# (v1.2.0) publishes a versioned release. Needs the ANDROID_TV_* signing secrets (see README).
name: Android TV app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A newer push to main replaces an unfinished main build; version tags each get their own run.
concurrency:
  group: androidtv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 != '' }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::warning::Skipping the Android TV app. Add the ANDROID_TV_* secrets to build it (see README)."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4

      # The app opens the site by address, so it's built for wherever this repo deploys.
      - name: Work out the site's address
        if: env.HAS_KEY == 'true'
        id: site
        run: |
          if [ -n "$DEPLOY_DOMAIN" ]; then
            echo "url=https://$DEPLOY_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
            echo "url=https://sus.$sub.workers.dev" >> "$GITHUB_OUTPUT"
          fi
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: env.HAS_KEY == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        if: env.HAS_KEY == 'true'
        working-directory: apps/androidtv
        env:
          SUS_URL: ${{ steps.site.outputs.url }}
          SUS_KEYSTORE: ${{ runner.temp }}/androidtv.jks
          SUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
          SUS_KEY_ALIAS: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          SUS_KEY_PASSWORD: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
          ANDROID_TV_KEYSTORE_BASE64: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export SUS_VERSION_NAME="${GITHUB_REF_NAME#v}"; else export SUS_VERSION_NAME="main-${GITHUB_SHA::7}"; fi
          # Android only installs an update with a higher version code. Minutes since 1970 always grow, whatever
          # triggered the build or however this workflow is named (a run counter restarts when the file is renamed).
          export SUS_VERSION_CODE=$(( $(date +%s) / 60 ))
          echo "$ANDROID_TV_KEYSTORE_BASE64" | base64 -d > "$SUS_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/sus-tv.apk"

      - name: Publish the versioned release
        if: env.HAS_KEY == 'true' && github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/sus-tv.apk" --title "Sus $GITHUB_REF_NAME" --generate-notes --latest

      - name: Refresh the main build
        if: env.HAS_KEY == 'true' && github.ref_type != 'tag'
        run: |
          # Move the tag rather than recreating the release, so the download link never disappears.
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          notes="Built from ${GITHUB_SHA::7} on main. This build follows main, like the site; versioned builds are the other releases."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$RUNNER_TEMP/sus-tv.apk" --clobber
            gh release edit latest --notes "$notes" --prerelease --latest=false
          else
            gh release create latest "$RUNNER_TEMP/sus-tv.apk" --title "Sus TV app (latest from main)" --notes "$notes" --prerelease --latest=false
          fi
