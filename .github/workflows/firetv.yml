# Builds the Fire TV app. Every push to main refreshes the rolling "firetv-main" pre-release, which
# <site>/tv.apk redirects to, so the app follows main the way the site does. Pushing a version tag
# (v1.2.0) publishes a versioned release. Needs the FIRETV_* signing secrets (see README).
name: Fire TV app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A newer push to main replaces an unfinished main build; version tags each get their own run.
concurrency:
  group: firetv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIRETV_KEYSTORE_BASE64 != '' }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::warning::Skipping the Fire TV app. Add the FIRETV_* secrets to build it (see README)."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4

      # The app opens the site by address, so it's built for wherever this repo deploys.
      - name: Work out the site's address
        if: env.HAS_KEY == 'true'
        id: site
        run: |
          if [ -n "$DEPLOY_DOMAIN" ]; then
            echo "url=https://$DEPLOY_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
            echo "url=https://sus.$sub.workers.dev" >> "$GITHUB_OUTPUT"
          fi
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: env.HAS_KEY == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        if: env.HAS_KEY == 'true'
        working-directory: apps/firetv
        env:
          SUS_URL: ${{ steps.site.outputs.url }}
          # One counter for main and tagged builds, so every new APK installs over whichever one is on the TV.
          SUS_VERSION_CODE: ${{ github.run_number }}
          SUS_KEYSTORE: ${{ runner.temp }}/firetv.jks
          SUS_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
          SUS_KEY_ALIAS: ${{ secrets.FIRETV_KEY_ALIAS }}
          SUS_KEY_PASSWORD: ${{ secrets.FIRETV_KEY_PASSWORD }}
          FIRETV_KEYSTORE_BASE64: ${{ secrets.FIRETV_KEYSTORE_BASE64 }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export SUS_VERSION_NAME="${GITHUB_REF_NAME#v}"; else export SUS_VERSION_NAME="main-${GITHUB_SHA::7}"; fi
          echo "$FIRETV_KEYSTORE_BASE64" | base64 -d > "$SUS_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/sus-tv.apk"

      - name: Publish the versioned release
        if: env.HAS_KEY == 'true' && github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/sus-tv.apk" --title "Sus $GITHUB_REF_NAME" --generate-notes --latest

      - name: Refresh the main build
        if: env.HAS_KEY == 'true' && github.ref_type != 'tag'
        run: |
          # Move the tag rather than recreating the release, so the download link never disappears.
          git tag -f firetv-main "$GITHUB_SHA"
          git push -f origin refs/tags/firetv-main
          notes="Built from ${GITHUB_SHA::7} on main. This build follows main, like the site; versioned builds are the other releases."
          if gh release view firetv-main >/dev/null 2>&1; then
            gh release upload firetv-main "$RUNNER_TEMP/sus-tv.apk" --clobber
            gh release edit firetv-main --notes "$notes" --prerelease --latest=false
          else
            gh release create firetv-main "$RUNNER_TEMP/sus-tv.apk" --title "Sus TV app (main)" --notes "$notes" --prerelease --latest=false
          fi
