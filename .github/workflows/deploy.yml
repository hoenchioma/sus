# Deploys the Worker (app + rooms) to Cloudflare on every push to main, then plays the simulated
# games against the live site. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, and
# optionally a DEPLOY_DOMAIN repository variable for a custom domain (see README).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one instead of cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 25
    env:
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # <site>/tv.apk redirects here: the Android TV app built from main by the Android TV app workflow.
      TV_APP_URL: https://github.com/${{ github.repository }}/releases/download/latest/sus-tv.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - id: deploy
        run: npm run deploy
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the live site
        run: npm run e2e
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: e2e-artifacts
