# Deploys the Worker (app + rooms) to Cloudflare on every push to main, then plays the simulated
# games against the live site. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, and
# optionally a DEPLOY_DOMAIN repository variable for a custom domain. With the FIRETV_* secrets it
# also builds the Fire TV app and serves it at <site>/tv.apk (see README).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one instead of cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 25
    env:
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WITH_TV_APP: ${{ secrets.FIRETV_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The TV app opens the site by address, so it's built for this deployment before the site goes up.
      - name: Work out the site's address
        if: env.WITH_TV_APP == 'true'
        id: site
        run: |
          if [ -n "$DEPLOY_DOMAIN" ]; then
            echo "url=https://$DEPLOY_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
            echo "url=https://sus.$sub.workers.dev" >> "$GITHUB_OUTPUT"
          fi
      - if: env.WITH_TV_APP == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: env.WITH_TV_APP == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Build the Fire TV app
        if: env.WITH_TV_APP == 'true'
        working-directory: apps/firetv
        env:
          SUS_URL: ${{ steps.site.outputs.url }}
          SUS_VERSION_CODE: ${{ github.run_number }}
          SUS_VERSION_NAME: 1.0.${{ github.run_number }}
          SUS_KEYSTORE: ${{ runner.temp }}/firetv.jks
          SUS_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
          SUS_KEY_ALIAS: ${{ secrets.FIRETV_KEY_ALIAS }}
          SUS_KEY_PASSWORD: ${{ secrets.FIRETV_KEY_PASSWORD }}
          FIRETV_KEYSTORE_BASE64: ${{ secrets.FIRETV_KEYSTORE_BASE64 }}
        run: |
          echo "$FIRETV_KEYSTORE_BASE64" | base64 -d > "$SUS_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../web/public/tv.apk

      - id: deploy
        run: npm run deploy
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Check the TV app is downloadable
        if: env.WITH_TV_APP == 'true'
        run: |
          curl -fsSI "${{ steps.deploy.outputs.url }}/tv.apk" | grep -i '^content-type: application/vnd.android.package-archive'
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the live site
        run: npm run e2e
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: e2e-artifacts
