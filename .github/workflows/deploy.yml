# Deploys the Worker (app + rooms) to Cloudflare on every push to main, then plays the simulated
# games against the live site. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see README).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one instead of cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sus.raheeb.xyz
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the live site
        run: npm run e2e
        env:
          BASE_URL: https://sus.raheeb.xyz
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: e2e-artifacts
